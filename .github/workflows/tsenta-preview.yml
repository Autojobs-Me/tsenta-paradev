# Preview build of a Tsenta UI branch, for looking at it before it ships.
#
# Every push to a tsenta/* branch except the agents' scratch branches (tsenta/wip-*), or a manual run, builds the macOS arm64
# and Windows x64 apps with scripts/fork/build.sh and uploads them as the
# tsenta-preview-mac-arm64 and tsenta-preview-win-x64 artifacts. Windows is a
# client for boxes and remote hosts only: local terminals do not run there. With the MAC_CERTIFICATE, CSC_NAME and APPLE_* secrets it is signed
# with Tsenta's Developer ID and notarized; without them it is ad-hoc signed, and
# after downloading it needs right-click > Open once.
# It installs as Paradev Tsenta (com.tsenta.paradev) beside Paradev and shares
# Paradev's ~/.paradev, so it is already signed in. Nothing is published.

name: Tsenta preview

on:
  push:
    branches: ["tsenta/**", "!tsenta/wip-*"]
    paths:
      - "apps/desktop/**"
      - "packages/**"
      - "scripts/fork/**"
      - "bun.lock"
      - ".github/workflows/tsenta-preview.yml"
  workflow_dispatch:

concurrency:
  group: tsenta-preview-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.platform }} ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, platform: mac, arch: arm64 }
          - { runner: windows-latest, platform: win, arch: x64 }
    defaults:
      run:
        shell: bash
    steps:
      # Paradev's component tree nests deeper than Windows' 260-character MAX_PATH.
      - if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.bun/install/cache
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: ${{ runner.os }}-${{ matrix.arch }}-tsenta-preview-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-tsenta-preview-
            ${{ runner.os }}-${{ matrix.arch }}-boxes-

      # Same as fork-sync.yml: Electron's download answers 504 for minutes at a
      # stretch, so fetch it with patient retries and check its SHA256 first.
      - name: Prefetch Electron
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/package.json').devDependencies.electron")
          case "${{ matrix.platform }}" in
            mac) os=darwin; dir="$HOME/Library/Caches/electron" ;;
            win) os=win32; dir="$LOCALAPPDATA/electron/Cache" ;;
          esac
          name="electron-v$version-$os-${{ matrix.arch }}.zip"
          base="https://github.com/electron/electron/releases/download/v$version"
          mkdir -p "$dir"
          fetch() { curl -fsSL --retry 30 --retry-all-errors --retry-delay 20 --retry-max-time 1500 -o "$2" "$1"; }
          fetch "$base/SHASUMS256.txt" "$RUNNER_TEMP/SHASUMS256.txt"
          want=$(grep " \*\?$name\$" "$RUNNER_TEMP/SHASUMS256.txt" | cut -d' ' -f1)
          [ -n "$want" ] || { echo "::error::$name not in SHASUMS256.txt"; exit 1; }
          sha() { if command -v sha256sum >/dev/null; then sha256sum "$1"; else shasum -a 256 "$1"; fi | cut -d' ' -f1; }
          if [ -f "$dir/$name" ] && [ "$(sha "$dir/$name")" = "$want" ]; then
            echo "Cached: $name"; exit 0
          fi
          fetch "$base/$name" "$dir/$name.part"
          [ "$(sha "$dir/$name.part")" = "$want" ] || { echo "::error::$name checksum mismatch"; exit 1; }
          mv "$dir/$name.part" "$dir/$name"
          echo "Fetched: $name"

      - name: Install dependencies
        run: |
          bun install --frozen --ignore-scripts
          bun run --filter=@superset/i18n build
          bun run --cwd apps/desktop install:deps

      - name: Version
        working-directory: apps/desktop
        run: |
          short=$(git rev-parse --short HEAD)
          node -e "const fs=require('fs');const p=require('./package.json');p.version=p.version.replace(/-.*$/,'')+'-tsenta.g'+process.argv[1];fs.writeFileSync('./package.json',JSON.stringify(p,null,'\t')+'\n')" "$short"

      # The Developer ID identity (MAC_CERTIFICATE, a base64 .p12) goes into a keychain this job owns, which
      # electron-builder then uses as CSC_KEYCHAIN with CSC_NAME. Without the secret the app is ad-hoc signed.
      - name: Set up signing keychain
        if: runner.os == 'macOS'
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$MAC_CERTIFICATE" ] || { echo "No MAC_CERTIFICATE secret: the app is ad-hoc signed."; exit 0; }
          KEYCHAIN="$RUNNER_TEMP/tsenta-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          printf '%s' "$MAC_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # No timeout and no lock on sleep, so the keychain cannot lock mid-build.
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$MAC_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$CERT_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Developer ID Application" || { echo "::error::No Developer ID Application identity in the signing keychain"; exit 1; }
          echo "CSC_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build
        env:
          # pdev has no Windows build; macOS must ship it.
          PDEV_BUNDLE_REQUIRED: ${{ matrix.platform != 'win' && '1' || '' }}
          # Paradev's analytics key: its per-account feature flags (cloud workspaces, ...) need it.
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
          CSC_NAME: ${{ secrets.CSC_NAME }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_PUBLISHER_NAME: ${{ vars.AZURE_PUBLISHER_NAME }}
        run: |
          for attempt in 1 2; do
            scripts/fork/build.sh ${{ matrix.platform }} ${{ matrix.arch }} && exit 0
            echo "::warning::build attempt $attempt failed"
          done
          exit 1

      - name: Smoke test
        run: scripts/fork/smoke.sh ${{ matrix.platform }}

      - name: Check signature and notarization
        if: runner.os == 'macOS'
        run: |
          [ -n "${CSC_KEYCHAIN:-}" ] || { echo "Not signed (no MAC_CERTIFICATE): skipped."; exit 0; }
          app=$(find apps/desktop/release -maxdepth 2 -name "*.app" -type d | head -1)
          codesign --verify --deep --strict "$app"
          spctl --assess --type execute -vv "$app"
          xcrun stapler validate "$app"

      - name: Delete signing keychain
        if: always() && runner.os == 'macOS'
        run: security delete-keychain "$RUNNER_TEMP/tsenta-signing.keychain-db" 2>/dev/null || true

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tsenta-preview-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
          retention-days: 7
          if-no-files-found: error
